name: Build Offline APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: '' # Skips downloading deprecated 'tools' package

      - name: Build Cordova APK
        run: |
          npm install -g cordova
          cordova create build_app com.fodmap.app "FODMAP Tracker"
          
          # Clean out default Cordova files
          rm -rf build_app/www/*
          
          # Check if files exist in public, otherwise copy from root
          if [ -d "public" ]; then
            cp -r public/* build_app/www/
          else
            cp -r * build_app/www/
          fi
          
          cd build_app
          cordova platform add android
          cordova build android --no-telemetry

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FODMAP-Offline-APK
          path: build_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
